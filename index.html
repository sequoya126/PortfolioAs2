<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zia's Chest</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <div class="page">
    <div class="logo-box">
        <img src="images/Logo_Zia_Chest.png" alt="Logo" />
      </div>
      <div class="chest-container">
        <div class="chest" id="chest">
          
          <div class="lid">
            <div class="lid-back-panel"></div> <div class="lid-main">
              <div class="metal-plate">
                <div class="chest-keyhole">
                  <div class="circle"></div>
                  <div class="slot"></div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="box">
            <div class="box-inner">
              <div class="internal-glow"></div>
            </div>
            <div class="box-front">
              <div class="metal-trim-left"></div>
              <div class="metal-trim-right"></div>
            </div>
          </div>
          
        </div>
      </div>
    </div>
    </div>
     <p class="name">Zia Maclean-Courvillle</p>

  <script src="index.js"></script>
</body>
</html>
